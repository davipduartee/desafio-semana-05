<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 05 – Objetos, Dados e Assincronismo</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --texto: #1f2933;
      --suave: #616e7c;
      --borda: #d9e2ec;
      --primaria: #2563eb;
      --primaria-escura: #1d4ed8;
      --erro: #b91c1c;
      --erro-bg: #fee2e2;
      --aviso: #92400e;
      --aviso-bg: #fef3c7;
      --info: #1e40af;
      --info-bg: #dbeafe;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--texto);
      line-height: 1.5;
    }

    header {
      background: var(--primaria);
      color: #fff;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 4px 0 0; opacity: 0.9; }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      display: grid;
      gap: 24px;
    }

    section {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 20px;
    }

    h2 { margin-top: 0; font-size: 1.2rem; }
    h3 { font-size: 1rem; margin-bottom: 8px; }

    .descricao { color: var(--suave); margin-top: -8px; }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
    }

    label {
      display: block;
      font-weight: 600;
      width: 100%;
    }

    input {
      flex: 1 1 200px;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--borda);
      border-radius: 8px;
    }

    input:focus { outline: 2px solid var(--primaria); outline-offset: 1px; }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--primaria);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--primaria-escura); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      margin: 16px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
    }
    .status:empty { display: none; }
    .status--carregando { background: var(--info-bg); color: var(--info); }
    .status--erro { background: var(--erro-bg); color: var(--erro); }
    .status--vazio { background: var(--aviso-bg); color: var(--aviso); }

    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 16px;
      margin: 16px 0 0;
    }
    dl:empty { display: none; }
    dt { font-weight: 600; color: var(--suave); }
    dd { margin: 0; }

    ul.lista { padding-left: 20px; margin: 8px 0; }
    .vazio-lista { color: var(--suave); font-style: italic; }

    .total {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 12px 0 0;
    }

    .pokemon {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }
    .pokemon:empty { display: none; }
    .pokemon img {
      width: 120px;
      height: 120px;
      image-rendering: pixelated;
      background: var(--bg);
      border-radius: 12px;
    }
    .pokemon h3 { margin: 0 0 8px; font-size: 1.3rem; text-transform: capitalize; }
    .tipos { display: flex; gap: 6px; flex-wrap: wrap; }
    .tipo {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--info-bg);
      color: var(--info);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: capitalize;
    }
  </style>
</head>
<body>
  <header>
    <h1>Objetos, Dados e Assincronismo</h1>
    <p>Desenvolvimento Web – Semana 05</p>
  </header>

  <main>
    <section id="parte1">
      <h2>Parte 1 – Pedidos pagos</h2>
      <p class="descricao">Pedidos validados (cliente não vazio e valor &gt; 0) e filtrados pelo status "pago".</p>
      <p id="resumo-pedidos"></p>
      <ul id="lista-pedidos" class="lista"></ul>
      <p id="total-faturado" class="total"></p>
    </section>

    <section id="parte2">
      <h2>Parte 2 – Buscador de CEP</h2>
      <form id="form-cep" novalidate>
        <label for="cep">CEP</label>
        <input id="cep" name="cep" type="text" inputmode="numeric" maxlength="9"
               placeholder="Ex: 01001-000" autocomplete="postal-code">
        <button type="submit" id="btn-cep">Buscar</button>
      </form>

      <p id="status-cep" class="status" role="status" aria-live="polite"></p>
      <dl id="resultado-cep"></dl>

      <h3>Histórico de buscas</h3>
      <ul id="historico-cep" class="lista"></ul>
    </section>

    <section id="parte3">
      <h2>Parte 3 – Mini Pokédex</h2>
      <form id="form-pokemon" novalidate>
        <label for="pokemon">Nome do Pokémon</label>
        <input id="pokemon" name="pokemon" type="text" placeholder="Ex: pikachu" autocomplete="off">
        <button type="submit" id="btn-pokemon">Buscar</button>
      </form>

      <p id="status-pokemon" class="status" role="status" aria-live="polite"></p>
      <div id="resultado-pokemon" class="pokemon"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
